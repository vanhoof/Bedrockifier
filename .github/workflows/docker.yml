name: Docker CI

on:
  push:
    branches: [ main, optional_broadcast ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  docker_tag: ${{ github.event_name != 'release' && 'test' || 'latest' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Docker - ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      arch: ${{ matrix.os == 'ubuntu-latest' && 'amd64' || 'arm64' }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-24.04-arm']

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set lowercase image name
      run: |
        echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@master

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build ${{ env.arch }}
      uses: docker/build-push-action@v5
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ./Docker/Dockerfile
        platforms: linux/${{ env.arch }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.docker_tag }}-${{ env.arch }}
        build-args: |
          QEMU_CPU=max
          arch=${{ env.arch }}
          swift_base=${{ env.swift_base }}
          swift_version=${{ env.swift_version }}

  merge-tags:
    needs: ['build']
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set lowercase image name
      run: |
        echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@master

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Make Manifest - ${{ env.docker_tag }}
      if: github.event_name != 'pull_request'
      run: bash Docker/merge.sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.docker_tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.docker_tag }}

    - name: Get Release Tag
      id: tag
      if: github.event_name == 'release'
      uses: dawidd6/action-get-tag@v1

    - name: Make Manifest - ${{ steps.tag.outputs.tag }}
      if: github.event_name == 'release'
      run: bash Docker/merge.sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ steps.tag.outputs.tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.docker_tag }}
    
    - name: Create latest tag for optional_broadcast branch
      if: github.ref == 'refs/heads/optional_broadcast'
      run: |
        docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.docker_tag }}-amd64 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.docker_tag }}-arm64
        docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
